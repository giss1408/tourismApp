# pubspec.yaml - ADD DEPENDENCIES
name: explore_world
description: A modern tourism app for exploring destinations

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  firebase_core: ^2.24.0
  firebase_auth: ^4.17.3
  google_sign_in: ^6.1.5
  flutter_facebook_auth: ^7.1.0
  shared_preferences: ^2.2.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  graphql: ^5.2.1
  url_launcher: ^6.3.0
  flutter_localizations: 
    sdk: flutter
  intl: ^0.19.0 
  firebase_messaging: ^14.9.4
  # 11.4.x: last release compatible with Flutter 3.24 (11.5 needs 3.27+).
  flutter_stripe: 11.4.0

# Keep the Stripe plugin family on 11.4.0 (see flutter_stripe above).
dependency_overrides:
  stripe_platform_interface: 11.4.0
  stripe_android: 11.4.0
  stripe_ios: 11.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  generate: true 

  assets:
    -  assets/images/
    -  assets/locales/

flutter_intl:
  enabled: true
  main_locale: en
# App icon: `dart run flutter_launcher_icons` (source art in assets/branding).
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/branding/app_icon.png"
  adaptive_icon_background: "#00794A"
  adaptive_icon_foreground: "assets/branding/app_icon_foreground.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/branding/app_icon.png"
    background_color: "#FBF7EF"
    theme_color: "#00794A"

# Launch screen: `dart run flutter_native_splash:create`.
flutter_native_splash:
  color: "#FBF7EF"
  image: assets/branding/splash_logo.png
  color_dark: "#0E1311"
  android_12:
    color: "#FBF7EF"
    image: assets/branding/app_icon_foreground.png
    icon_background_color: "#00794A"
    color_dark: "#0E1311"
  web: true
