plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    // END: FlutterFire Configuration
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Release signing: android/key.properties (never committed) with storeFile,
// storePassword, keyAlias and keyPassword. See README "Release".
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.regisse.tourism"
    // 35: required by the Stripe SDK.
    compileSdk = 35
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "com.akwabaivoire.app"
        // Stripe requires API 21+.
        minSdk = Math.max(flutter.minSdkVersion, 21)
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    // dev: local/staging backend, keeps the existing Firebase app id.
    // prod: store build. Run with `flutter run --flavor dev|prod
    // --dart-define-from-file=config/<flavor>.json`.
    flavorDimensions += "env"
    productFlavors {
        dev {
            dimension "env"
            applicationId "com.regisse.tourism"
            manifestPlaceholders = [appLabel: "Akwaba Ivoire Dev"]
        }
        prod {
            dimension "env"
            applicationId "com.akwabaivoire.app"
            manifestPlaceholders = [appLabel: "Akwaba Ivoire"]
        }
    }

    signingConfigs {
        if (keystorePropertiesFile.exists()) {
            release {
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
                storeFile file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            if (keystorePropertiesFile.exists()) {
                signingConfig = signingConfigs.release
            } else {
                // Local release runs only: store uploads need key.properties.
                logger.warn("android/key.properties missing: release build signed with the debug key.")
                signingConfig = signingConfigs.debug
            }
        }
    }
}

flutter {
    source = "../.."
}
